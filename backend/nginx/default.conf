set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Drop anything not addressed to our hostname (direct-IP scans) ──
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name api.atennaia.com.br;
    # $server_name (não $host) — evita host-header injection no redirect
    return 301 https://api.atennaia.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.atennaia.com.br;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 55m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /nexussafe/ {
        alias /var/www/admin/;
        try_files $uri $uri/ /nexussafe/index.html;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY";
    }
    # /metrics é interno: Prometheus raspa pela rede docker (backend:8000).
    # Nunca exposto no domínio público.
    location = /metrics { return 404; }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host api.atennaia.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }
}
