x-environment: &default-environment
  DATABASE_URL: postgres://postgres:${PG_PW}@postgres:5432/postgres
  SECRET_KEY: ${SECRET_KEY}
  EMAIL_URL: ${EMAIL_URL}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  CELERY_WORKER_AUTOSCALE: "1,3"
  REDIS_URL: redis://redis:6379/0
  ENABLE_OPEN_USER_REGISTRATION: ${ENABLE_OPEN_USER_REGISTRATION}
  GLITCHTIP_MAX_EVENT_LIFE_DAYS: ${GLITCHTIP_MAX_EVENT_LIFE_DAYS}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}

# GlitchTip 6.2.6 — NÃO usar a tag `v4.2`: naquele build o handler
# `/api/<id>/envelope/` é um stub sem corpo (retorna HTTP 200 e descarta o
# evento), então nada era ingerido. Ver README "Armadilhas".

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_PW}
    volumes: [ "pg_data:/var/lib/postgresql/data" ]
    restart: unless-stopped
    networks: [ gt ]
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    networks: [ gt ]
  web:
    image: glitchtip/glitchtip:6.2.6
    depends_on: [ postgres, redis, gt-patches ]
    environment:
      <<: *default-environment
      PORT: "8080"
    restart: unless-stopped
    networks: [ gt, atenna-backend_atenna ]
  worker:
    image: glitchtip/glitchtip:6.2.6
    command: ./bin/run-celery-with-beat.sh
    depends_on: [ postgres, redis ]
    environment: *default-environment
    restart: unless-stopped
    networks: [ gt ]
  migrate:
    image: glitchtip/glitchtip:6.2.6
    depends_on: [ postgres ]
    command: "./manage.py migrate"
    environment: *default-environment
    networks: [ gt ]
    restart: on-failure
  # Reaplica patches de SQL (idempotentes) a cada `up`, depois do migrate.
  # Hoje só corrige get_project_auth_info() (tipo de coluna errado no 6.2.6).
  gt-patches:
    image: postgres:17-alpine
    depends_on: [ postgres, migrate ]
    entrypoint: [ "sh", "-c", "for f in /patches/*.sql; do echo \"applying $$f\"; psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$$f\"; done" ]
    environment:
      DATABASE_URL: postgres://postgres:${PG_PW}@postgres:5432/postgres
    volumes: [ "./patches:/patches:ro" ]
    networks: [ gt ]
    restart: on-failure

volumes:
  pg_data:

networks:
  gt:
  atenna-backend_atenna:
    external: true
