x-environment: &default-environment
  DATABASE_URL: postgres://postgres:${PG_PW}@postgres:5432/postgres
  SECRET_KEY: ${SECRET_KEY}
  EMAIL_URL: ${EMAIL_URL}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  CELERY_WORKER_AUTOSCALE: "1,3"
  REDIS_URL: redis://redis:6379/0
  ENABLE_OPEN_USER_REGISTRATION: ${ENABLE_OPEN_USER_REGISTRATION}
  GLITCHTIP_MAX_EVENT_LIFE_DAYS: ${GLITCHTIP_MAX_EVENT_LIFE_DAYS}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_PW}
    volumes: [ "pg_data:/var/lib/postgresql/data" ]
    restart: unless-stopped
    networks: [ gt ]
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    networks: [ gt ]
  web:
    image: glitchtip/glitchtip:v4.2
    depends_on: [ postgres, redis ]
    environment:
      <<: *default-environment
      PORT: "8080"
    restart: unless-stopped
    networks: [ gt, atenna-backend_atenna ]
  worker:
    image: glitchtip/glitchtip:v4.2
    command: ./bin/run-celery-with-beat.sh
    depends_on: [ postgres, redis ]
    environment: *default-environment
    restart: unless-stopped
    networks: [ gt ]
  migrate:
    image: glitchtip/glitchtip:v4.2
    depends_on: [ postgres ]
    command: "./manage.py migrate"
    environment: *default-environment
    networks: [ gt ]
    restart: on-failure

volumes:
  pg_data:

networks:
  gt:
  atenna-backend_atenna:
    external: true
