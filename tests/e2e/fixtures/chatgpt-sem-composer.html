<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Atenna E2E Fixture — ChatGPT sem composer ainda (B13)</title>
  <style>
    body { margin: 0; background: #212121; color: #ececec; font-family: sans-serif; }
    .main { display: flex; flex-direction: column; align-items: center; padding-top: 40vh; }
    #login-wall { color: #999; }
    #prompt-textarea {
      width: 600px; height: 52px; padding: 12px 16px;
      background: #2f2f2f; border: 1px solid #444; border-radius: 12px;
      color: #ececec; font-size: 16px; resize: none; outline: none;
    }
    .input-wrap { position: relative; width: 600px; }
  </style>
</head>
<body>
  <!--
    FASE 10.9 (B13) — simula a página do ChatGPT ANTES do login: nenhum
    composer no DOM. window.__atennaAddComposer() adiciona o textarea depois,
    simulando o login concluído — o teste chama isso pra provar que o badge
    completo assume o lugar do badge "de espera".
  -->
  <div class="main" id="main">
    <p id="login-wall">Faça login para continuar</p>
  </div>
  <script>
    window.__atennaAddComposer = function () {
      const wrap = document.createElement('div');
      wrap.className = 'input-wrap';
      wrap.innerHTML = '<textarea id="prompt-textarea" placeholder="Message ChatGPT"></textarea>';
      document.getElementById('main').appendChild(wrap);
    };
  </script>
</body>
</html>
