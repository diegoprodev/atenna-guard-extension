name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Frontend: typecheck (informativo), testes unitários, build ────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: tsc --noEmit (informativo — limpeza = FASE 9.3)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: vitest (bloqueante)
        run: npx vitest run
      - name: build (bloqueante)
        run: npm run build
      - name: dist/ completo?
        run: |
          set -e
          test -f dist/content.js
          test -f dist/background.js
          test -f dist/manifest.json
          test -f dist/popup.js
          echo "dist OK"

  # ── Backend: pytest na mesma configuração do container ───────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: apt (tesseract p/ os testes de OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-por tesseract-ocr-eng libgl1 libglib2.0-0
      - name: pip install
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: modelos spaCy
        run: |
          python -m spacy download pt_core_news_sm
          python -m spacy download en_core_web_sm
      - name: pytest (bloqueante — 0 falhas)
        env:
          STRICT_DLP_MODE: "true"
        run: python -m pytest -q -p no:cacheprovider

  # ── Segredos: gitleaks ─────────────────────────────────────────────────
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks precisa do commit base p/ calcular o range do PR
      # A action varre só o DELTA (base^..head), não o histórico todo — as chaves
      # antigas em commits velhos não entram no scan. Purga de histórico = FASE 9.3.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # ── Gate único: tudo verde ─────────────────────────────────────────────
  ci-ok:
    if: always()
    needs: [frontend, backend, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: exige todos os jobs verdes
        run: |
          echo "frontend=${{ needs.frontend.result }} backend=${{ needs.backend.result }} secrets=${{ needs.secrets.result }}"
          [ "${{ needs.frontend.result }}" = "success" ] || exit 1
          [ "${{ needs.backend.result }}" = "success" ] || exit 1
          [ "${{ needs.secrets.result }}" = "success" ] || exit 1
          echo "CI verde"
