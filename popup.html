<!DOCTYPE html>
<html lang="pt-BR" style="width:420px;height:auto;overflow:hidden;max-height:100vh;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atenna</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="modal.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{width:420px;overflow:hidden;height:auto}
    body{
      width:420px;background:var(--paper);color:var(--text);
      font-family:var(--sans);overflow:hidden!important;
      display:flex;flex-direction:column;
    }
    #atenna-popup{width:100%;display:flex;flex-direction:column;overflow:hidden!important}
    ::selection{background:rgba(18,152,106,.18)}
    :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

    /* ── skeleton ── */
    .ap-skeleton{padding:22px 20px;display:flex;flex-direction:column;gap:11px}
    .ap-sk-line{height:12px;border-radius:6px;background:var(--line);animation:ap-sk 1.4s ease infinite}
    .ap-sk-w60{width:60%}.ap-sk-w40{width:40%}
    @keyframes ap-sk{0%,100%{opacity:.5}50%{opacity:.9}}
    @keyframes ap-spin{to{transform:rotate(360deg)}}

    .ap-root{display:flex;flex-direction:column;background:var(--paper)}

    /* ── header ── */
    .ap-header{display:flex;align-items:center;gap:10px;padding:15px 18px 13px;border-bottom:1px solid var(--line)}
    .ap-header__logo{width:34px;height:34px;border-radius:8px;flex-shrink:0;background:var(--paper-2);padding:2px}
    .ap-header__info{flex:1;min-width:0}
    .ap-header__name{font-size:13px;font-weight:650;color:var(--text)}
    .ap-header__email{font-size:11px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ap-badge{font-size:10px;font-weight:700;border-radius:20px;padding:3px 10px;letter-spacing:.05em;flex-shrink:0}
    .ap-badge--pro{background:var(--accent-soft);color:var(--accent-press);border:1px solid var(--ok-line)}
    .ap-badge--free{background:var(--paper);color:var(--text-soft);border:1px solid var(--line)}

    /* ── platform status ── */
    .ap-platform{display:flex;align-items:center;gap:8px;padding:9px 18px;font-size:12px}
    .ap-platform--ok{background:var(--ok-bg);color:var(--accent-press)}
    .ap-platform--warn{background:var(--paper);color:var(--text-soft)}
    .ap-platform__dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .ap-platform__dot--green{background:var(--accent);box-shadow:0 0 0 3px rgba(11,110,75,.15)}
    .ap-platform__dot--gray{background:#C7CFCB}
    .ap-platform__icon{display:flex;align-items:center}

    /* ── buttons ── */
    .ap-btn{
      display:flex;align-items:center;justify-content:center;gap:7px;
      font-family:inherit;font-size:13px;font-weight:600;
      border:none;border-radius:var(--radius-sm);cursor:pointer;transition:background 140ms,box-shadow 140ms;
    }
    .ap-btn--primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(10,46,35,.14)}
    .ap-btn--primary:hover:not(:disabled){background:var(--accent-press);box-shadow:0 2px 8px rgba(10,46,35,.16)}
    .ap-btn--primary:disabled{background:#CFCABC;color:#F4F3EE;box-shadow:none;cursor:not-allowed}
    .ap-btn--big{padding:11px 20px;width:calc(100% - 36px);margin:14px 18px 0}

    .ap-btn--google{
      display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 14px;
      background:var(--paper-2);color:var(--text);border:1px solid var(--line);border-radius:var(--radius-sm);
      font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:background 140ms,border-color 140ms;
    }
    .ap-btn--google:hover:not(:disabled){background:#F4F2ED;border-color:#D9D4C8}
    .ap-btn--google:disabled{opacity:.55;cursor:not-allowed}

    /* ── tips ── */
    .ap-tips{margin:12px 18px 0;padding:12px 14px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-sm)}
    .ap-tips__title{font-size:11px;font-weight:600;color:var(--text-soft);margin-bottom:7px;letter-spacing:.03em;text-transform:uppercase}
    .ap-tips__list{display:flex;gap:6px;flex-wrap:wrap}
    .ap-tips__list span{font-size:11px;color:var(--text-soft);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-family:var(--mono)}

    /* ── features ── */
    .ap-features{display:flex;flex-direction:column;margin:10px 0 0}
    .ap-feature{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:12px;color:var(--text);border-bottom:1px solid var(--line)}
    .ap-feature:last-child{border-bottom:none}
    .ap-feature__icon{
      flex-shrink:0;display:flex;align-items:center;justify-content:center;
      width:28px;height:28px;border-radius:7px;background:var(--accent-soft);color:var(--accent-press);
    }
    .ap-feature__icon svg{display:block}

    /* ── footer ── */
    .ap-footer{display:flex;border-top:1px solid var(--line);margin-top:12px}
    .ap-footer__btn{
      flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
      font-family:inherit;font-size:12px;font-weight:500;color:var(--text-soft);
      background:none;border:none;cursor:pointer;padding:12px 8px;transition:background 140ms;
      border-right:1px solid var(--line);
    }
    .ap-footer__btn:last-child{border-right:none}
    .ap-footer__btn:hover{background:var(--paper-2)}
    .ap-footer__btn--danger{color:var(--danger)}
    .ap-footer__btn--danger:hover{background:var(--danger-bg)}

    /* ── login / states ── */
    .ap-root--login{padding:26px 24px 22px;align-items:center;gap:13px}
    .ap-login-logo{display:flex;justify-content:center}
    .ap-login-title{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--text);text-align:center;letter-spacing:-.01em}
    .ap-login-sub{font-size:12.5px;color:var(--text-soft);text-align:center;line-height:1.5;max-width:300px;margin:-4px auto 2px}
    .ap-login-form{width:100%;display:flex;flex-direction:column;gap:10px}
    .ap-login-form input{
      width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
      font-size:14px;font-family:inherit;color:var(--text);background:var(--paper-2);outline:none;
      caret-color:var(--focus);transition:border-color 150ms,box-shadow 150ms;
    }
    .ap-login-form input::placeholder{color:var(--text-soft)}
    .ap-login-form input:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(18,152,106,.12)}
    .ap-login-form .ap-btn--primary{padding:11px;width:100%;margin:0;font-size:14px}
    .ap-login-err{
      width:100%;font-size:12px;color:var(--danger);background:var(--danger-bg);
      border:1px solid var(--danger-line);border-radius:6px;padding:8px 12px;text-align:center;line-height:1.4;
    }
    .ap-pass-wrap{position:relative;width:100%}
    .ap-pass-wrap input{width:100%;padding-right:38px}
    .ap-eye-btn{
      position:absolute;right:10px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;color:var(--text-soft);display:flex;align-items:center;padding:0;
    }
    .ap-eye-btn:hover{color:var(--text)}
    .ap-login-links{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-soft)}
    .ap-link-btn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;padding:0}
    .ap-link-btn:hover{color:var(--accent-press);text-decoration:underline}
    .ap-login-divider{display:flex;align-items:center;gap:8px;width:100%;color:var(--text-soft);font-size:11px}
    .ap-login-divider::before,.ap-login-divider::after{content:'';flex:1;height:1px;background:var(--line)}

    /* ── generic state screen (onboarding, reset/signup confirm) ── */
    .ap-state{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px;text-align:center;background:var(--paper)}
    .ap-state__icon{
      width:52px;height:52px;border-radius:50%;background:var(--accent-soft);
      display:flex;align-items:center;justify-content:center;color:var(--accent);
    }
    .ap-state__title{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--text);letter-spacing:-.01em}
    .ap-title{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--text)}
    .ap-state__text,.ap-subtitle{font-size:12.5px;color:var(--text-soft);line-height:1.6}
    .ap-state__text strong,.ap-subtitle strong{color:var(--text);font-weight:600}

    .ap-links{display:flex;flex-direction:column;gap:8px;width:100%}
    .ap-link-row{
      display:flex;align-items:center;gap:10px;padding:10px 13px;
      border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);
      text-decoration:none;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;
      transition:border-color 130ms,background 130ms;
    }
    .ap-link-row:hover{border-color:#CFE6D9;background:#F3F8F5}
    .ap-link-row__host{margin-left:auto;color:var(--text-soft);font-size:11px;font-family:var(--mono)}
    .ap-link-row__ico{display:flex;flex-shrink:0}

    .ap-cta{
      padding:9px 20px;border-radius:var(--radius-sm);background:none;border:1px solid var(--line);
      color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background 130ms;
    }
    .ap-cta:hover{background:var(--paper-2)}
  </style>
</head>
<body>
  <div id="atenna-popup"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
